version: 2
updates:
  # Dependabot - código vulnerable
  - package-ecosystem: "pip"
    directory: "/app_vulnerable"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dependencias-app-vulnerable:
        patterns: ["*"]

  # Dependabot - versión corregida
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dependencias-app:
        patterns: ["*"]

  # Dependabot - imágenes Docker
  - package-ecosystem: "docker"
    directory: "/app_vulnerable"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
