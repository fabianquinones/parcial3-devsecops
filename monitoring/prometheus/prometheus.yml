global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: securedev-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
